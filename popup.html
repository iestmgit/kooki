<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #333;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    .off {
      background: #ff4444;
      color: white;
    }
    .on {
      background: #44bb44;
      color: white;
    }
    .shortcut {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    kbd {
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #ccc;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h3>🚀 Auto Clicker</h3>
  <div id="status" class="status off">⏸️ متوقف</div>
  <div class="shortcut">
    کلیک با <kbd>Ctrl</kbd> + <kbd>Space</kbd>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
